<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospecting Desk</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1d2330; --muted:#5f6878; --line:#e2e5ea;
  --accent:#2457d6; --accent-soft:#e8eefc; --good:#1f8a4c; --good-soft:#e5f5ec;
  --warn:#b26a00; --warn-soft:#fdf1df; --bad:#c23a3a; --bad-soft:#fbe9e9;
  --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1c2027; --text:#e6e9ee; --muted:#9aa3b2; --line:#2d333d;
    --accent:#7aa2ff; --accent-soft:#22304f; --good:#5fd08f; --good-soft:#1c3628;
    --warn:#f0b357; --warn-soft:#3a2d17; --bad:#ff8080; --bad-soft:#3d2020; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --text:#e6e9ee; --muted:#9aa3b2; --line:#2d333d;
  --accent:#7aa2ff; --accent-soft:#22304f; --good:#5fd08f; --good-soft:#1c3628;
  --warn:#f0b357; --warn-soft:#3a2d17; --bad:#ff8080; --bad-soft:#3d2020; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
body{padding-left:var(--sideW,220px)}
html,body{overscroll-behavior:none}
nav#nav,.dlg-b{overscroll-behavior:contain}
body.navmin{--sideW:60px}
nav#nav{position:fixed;left:0;top:0;bottom:0;width:var(--sideW,220px);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;overflow-y:auto;z-index:6}
nav .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:2px 6px 10px}
nav .brand img{width:26px;height:26px;border-radius:6px}
nav .brand span{white-space:nowrap;font-size:14px}
.tog{margin-right:-8px;flex:none;background:none;border:1px solid transparent;color:var(--muted);border-radius:6px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tog:hover{border-color:var(--line);color:var(--text)}
.tog svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.navmin nav .brand{justify-content:center;padding:2px 0 8px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:12px 10px 4px}
nav button.it{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--text);padding:7px 10px;border-radius:7px;cursor:pointer;font:inherit;text-align:left}
nav button.it:hover{background:var(--accent-soft)}
nav button.it.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .ic{width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center}
nav .ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#navTip{position:fixed;z-index:50;background:var(--text);color:var(--panel);padding:6px 10px;border-radius:7px;font-size:12px;line-height:1.35;max-width:240px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none}
#navTip b{display:block;font-size:13px}
nav .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav .ct{font-size:11px;font-weight:600;min-width:20px;padding:0 6px;border-radius:9px;line-height:18px;text-align:center;background:var(--bad-soft);color:var(--bad)}
nav .ct.w{background:var(--warn-soft);color:var(--warn)}
nav .ct.g{background:var(--good-soft);color:var(--good)}
nav .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
body.navmin nav .lb, body.navmin nav .grp, body.navmin nav .brand span{display:none}
body.navmin nav .ct{position:absolute;margin-left:22px;margin-top:-14px;min-width:0;padding:0 4px;font-size:10px;line-height:14px}
body.navmin nav button.it{justify-content:center;position:relative}
@media (max-width:760px){ body{padding-left:60px} nav#nav{width:60px} nav .lb, nav .grp, nav .brand span{display:none} nav button.it{justify-content:center} }
.goalpill{margin-left:auto;font-size:13px;color:var(--muted)}
.goalpill b{color:var(--text)}
main{max-width:1150px;margin:0 auto;padding:20px 16px 60px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:400;color:var(--muted);font-size:13px}
.stat .n{font-size:28px;font-weight:600}
.stat .l{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:none}
.who{flex:1;min-width:200px}
.who b{display:block}
.who span{color:var(--muted);font-size:13px}
.cn{cursor:pointer}.cn:hover{color:var(--accent);text-decoration:underline}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.b{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 11px;border-radius:6px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.p{color:#0d1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.p{color:#0d1220}}
button.g{background:var(--good);border-color:var(--good);color:#fff}
button.s{padding:4px 8px;font-size:13px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:160px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.cov td{text-align:center}
.cov td:first-child{text-align:left;font-weight:600}
.cov .has{color:var(--good);font-size:12px}
.cov .gap{color:var(--bad);cursor:pointer;font-size:12px}
.cov .gap:hover{text-decoration:underline}
.cov .via{color:var(--muted);font-size:12px}
.acct{margin-bottom:14px}
.acct h2 select{width:auto;font-size:13px;padding:3px 6px;margin-left:8px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.muted{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(680px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center}
.dlg-h .x{margin-left:auto}
.dlg-b{padding:14px 18px;overflow:auto;max-height:65vh}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
pre.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 "Segoe UI",system-ui,sans-serif;margin:0}
.weeks{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}
.weeks div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.weeks div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.weeks div.goalline{background:none}
.wl{display:flex;gap:6px;font-size:11px;color:var(--muted)}
.wl span{flex:1;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.steps{display:flex;gap:3px;margin-top:4px}
.steps i{width:14px;height:5px;border-radius:2px;background:var(--line)}
.steps i.d{background:var(--good)}
.steps i.c{background:var(--accent)}
.hint{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
</style>

<!-- SheetJS (optional). To enable .xlsx import and export, replace the next tag with
     <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
     or with the embedded library. Without it the app still works: CSV and tab-separated paste and import
     work, and every "Export to Excel" button downloads a CSV file instead. -->
<script>/*SHEETJS*/</script>
<script>
"use strict";
// =====================================================================
// CONFIG: the names and words this app uses. Change these first.
// Every visible label, AI prompt, template and toast reads from here.
// =====================================================================
const CONFIG = {
  appName: "Prospecting Desk",          // sidebar brand, page title, backup and sync file names, calendar reminder
  company: "[Your Company]",            // your employer: fills {company} in templates, the signature and AI prompts
  parent: "Account",                    // top level of the territory: a customer organization or group
  parents: "Accounts",
  site: "Site",                         // second level: a location, division or subsidiary under a parent
  sites: "Sites",
  centralOffice: "Central office",      // a parent's head-office row on Coverage (added when a parent has 2+ sites)
  ai: "your AI assistant",              // what prompts are pasted into, used mid-sentence ("Paste into your AI assistant")
  aiShort: "AI",                        // short form for buttons, chips and the nav ("Map with AI", "AI Feed")
  mail: "email",                        // your mail tool, the way the AI should search it
  chat: "chat",                         // your chat tool
  calendar: "calendar",                 // your calendar tool
  meetingNotes: "meeting recaps and transcripts", // where meeting content lives
  drive: "cloud drive",                 // the synced folder that holds the backup and sync file
  crm: "CRM",                           // your system of record (Weekly report, quota card)
  valueLabel: "Value",                  // what pipeline is measured in (Value, Revenue, ARR, Gross profit...)
  segment: "[your market]",             // who you sell to, used in AI prompts ("organizations in [your market]")
  region: "[your region]",              // where your territory is, used in AI prompts
  fyStartMonth: 1,                      // first month of the fiscal year (1 = January): sets the default quarter,
                                        // buying-calendar windows and the "new fiscal year" check-back date
  voiceGuide: "[my voice guide]",       // a file or note your AI can read that shows how you write
  accountFile: "[my account export]",   // a spreadsheet your AI can read with purchases, renewals and pipeline
  currency: "USD",                      // currency for money shown in the app
  ask: "a short call",                  // what outreach asks for: fills {ask} in templates and every draft prompt
  tone: "",                             // default writing tone for drafts (Data & Settings > Writing tone overrides it)
  callWindows: "",                      // optional call-time advice shown on the call blitz (e.g. "Best times: ..."); blank hides it
  aiReads: true,                        // can the AI read your mail, chat, calendar and meeting notes? false = manual "Who replied?"
                                        // checklist on Today, no scans, no history backfill, prompts work from what you paste
  aiSchedules: true,                    // can the AI run saved prompts on a schedule? false = no "version to schedule" buttons
  singleLevel: false,                   // true = single companies (no separate sites): one row per company, simpler Coverage
  linkedin: true,                       // false = no LinkedIn: the LinkedIn step becomes a short check-in email (key "li" kept)
  // Automation inbox (Part B §7, route "your company's automation tool"). on:false = the app looks and works exactly as
  // semi-automated, with no automation UI. planned:true (with on:false) shows the Settings panel as "Not connected yet"
  // with the recipe and IT note ("Start semi, plan for automated"). A scheduled flow in `tool` saves each exchange's table
  // as <id>_YYYY-MM-DD.md in the `inbox` subfolder of the sync folder; the app writes today's prompts to `prompts`.
  // autoLow: first-run default for "Apply low-risk rows without review" (the rep can change it in Settings).
  automation: {on:false, planned:false, route:"tool", tool:"your automation tool", inbox:"inbox", prompts:"prompts", autoLow:false}
};
// Your territory, if you want every account on Coverage before you have contacts there.
// Leave it empty to build accounts from imports (Data & Settings > Import account list, or the
// "Account list" AI exchange), account-mapping pastes and your contacts.
// Format: ["Parent name", ["Site 1", "Site 2"]]. A parent with one site can list itself as the site.
const TERRITORY = [ /* ["Northfield Group", ["Northfield Site A", "Northfield Site B"]], ... */ ];
// Optional central units that buy for a parent's sites (shared services, a central purchasing team...).
// Format: {"Parent name": [["Unit name", "Central unit", "What it buys or runs"]]}
const TERRITORY_EXTRA = {};
// Optional nicknames people use for a site or parent: {"nickname": "Full name as listed"}.
const NAME_ALIAS = {};

// Wording built from CONFIG: TX.parent = "account", TX.Parent = "Account", TX.aParent = "an account", ...
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const low = s => String(s).toLowerCase();
const art = s => (/^[aeiou]/i.test(String(s)) ? "an " : "a ") + s;
const TX = {
  ai:CONFIG.ai, Ai:cap(CONFIG.ai), AI:CONFIG.aiShort, anAI:art(CONFIG.aiShort),
  Parent:CONFIG.parent, parent:low(CONFIG.parent), Parents:CONFIG.parents, parents:low(CONFIG.parents), aParent:art(low(CONFIG.parent)),
  Site:CONFIG.site, site:low(CONFIG.site), Sites:CONFIG.sites, sites:low(CONFIG.sites), aSite:art(low(CONFIG.site)),
  central:CONFIG.centralOffice, Value:CONFIG.valueLabel, value:low(CONFIG.valueLabel), Drive:cap(CONFIG.drive), Crm:CONFIG.crm,
  sources:`my ${CONFIG.mail}, ${CONFIG.chat}, ${CONFIG.calendar} and ${CONFIG.meetingNotes}`,
  yourSources:`your ${CONFIG.mail}, ${CONFIG.chat}, ${CONFIG.calendar} and ${CONFIG.meetingNotes}`,
  mktShort:`organizations in ${CONFIG.segment}`, mkt:`organizations in ${CONFIG.segment} in ${CONFIG.region}`
};
// Column headers the AI is asked to return, and the lowercase header names the paste parser accepts for them.
// parent and site named the same (e.g. both "Company") would give duplicate headers: the parent column becomes "Parent",
// and the app runs as single companies (SINGLE).
const SAME_LEVEL = low(CONFIG.parent) === low(CONFIG.site), SINGLE = !!CONFIG.singleLevel || SAME_LEVEL;
const COL = {Site:CONFIG.site, Parent:SAME_LEVEL ? (low(CONFIG.site) === "parent" ? "Parent group" : "Parent") : CONFIG.parent, Value:CONFIG.valueLabel};
const KS = {site:[...new Set([low(CONFIG.site),"site","organization","company","account"])], parent:[...new Set([low(COL.Parent),"parent","account"])], value:[...new Set([low(CONFIG.valueLabel),"value"])]};

// ---------- constants ----------
// Storage names come from CONFIG.appName, so two builds with different names never share data
// (Chrome treats every file:// page as one origin). Keep appName stable once you use the app.
const slug = v => String(v || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "app";
const STORE = "pd." + slug(CONFIG.appName);
const KEY = STORE + ".v1";                 // localStorage: all app data
const PREF = k => STORE + "." + k;         // localStorage: small per-browser preferences
const IDB_NAME = STORE;                    // IndexedDB: the remembered sync-file handle
const PERSONAS = ["Executive sponsor","Department leader","Technical lead","Security / Risk","Purchasing","Finance","Operations","Other"];
// Roles Coverage, account pages and gap checks look for ("missing roles"). A subset of PERSONAS.
const CORE_ROLES = PERSONAS.filter(p => p !== "Other");
// Buyer types that are usually not technical: drafts avoid jargon and ask who else should join.
const NON_TECH = ["Executive sponsor","Purchasing","Finance","Operations"];
const STEPS = [
  {day:0,  type:"Email",    key:"email1",  label:"First email"},
  {day:2,  type:"Call",     key:"call1",   label:"Call + voicemail"},

function focusStats(f){
  const T = S.touches.filter(x => x.focusId === f.id), first = {};
  T.forEach(x => { if(x.contactId && (!first[x.contactId] || x.date < first[x.contactId])) first[x.contactId] = x.date; });
  const ids = Object.keys(first), people = ids.map(contact).filter(Boolean);
  const mt = S.meetings.filter(m => m.contactId && talkOk(m) && first[m.contactId] && mtgSet(m) >= first[m.contactId] && daysBetween(first[m.contactId], mtgSet(m)) <= 60);
  const replied = people.filter(c => ["replied","booked"].includes(c.status) || mt.some(m => m.contactId === c.id));
  const opps = [...new Set(mt.map(m => m.oppId).filter(Boolean))].map(id => S.opps.find(o => o.id === id)).filter(Boolean);
  const val = opps.reduce((a, o) => a + (num(o.value) || 0), 0);
  return {T, people, replied, mt, opps, value:val, last:T.reduce((a, x) => x.date > a ? x.date : a, "")};
}

const DEAL_TYPES = ["Quote","Renewal","Dead opportunity"];
const DEAL_STATUS = ["Open","Customer replied","Stalled","Won","Lost","No response"];
// Default cadences. Quote: days after sent. Renewal: days before renewal date. Opportunity: every 7 days.
const CADENCE = {Quote:[2,5,9,14,21,30], Renewal:[-90,-60,-45,-30,-14,-7,-3]};
// Columns of the Hot Follow-ups export, and of the "Hot follow-up run" AI table (minus Owner and Notes, plus Open Questions).
const HOT_COLS = ["Ref","Type",COL.Site,"Contact","Contact Email","Amount",COL.Value,"Sent Date","Expires/Renews","Status","Owner","Last Interaction","Last Interaction Type","Next Step","Next Step Date","Draft Subject","Draft Body","Notes"];
function dealOpen(d){ return !["Won","Lost","No response"].includes(d.status) && !d.archived; }
function oppositeType(t){ return /call|phone|meeting/i.test(t||"") ? "Email" : "Call"; }
function defaultNext(d){
  const t = todayStr(), type = oppositeType(d.lastType);
  if(d.type === "Renewal" && d.expires){
    const due = CADENCE.Renewal.map(o => addDays(d.expires, o)).find(x => x >= (d.lastDate ? addDays(d.lastDate,1) : t)) || t;
    return {date: due < t ? t : due, type};
  }
  if(d.type === "Quote" && d.sent){
    if(d.expires && daysBetween(t, d.expires) <= 7 && daysBetween(t, d.expires) >= 0 && (!d.lastDate || d.lastDate < t)) return {date:t, type};
    const due = CADENCE.Quote.map(o => addDays(d.sent, o)).find(x => x > (d.lastDate || addDays(d.sent,0))) || addDays(d.lastDate || t, 7);
    return {date:due, type};
  }
  return {date: addDays(d.lastDate || t, d.lastDate ? 7 : 0), type};
}

function crmApply(){

// ---------- Sync file (in a synced cloud-drive folder) ----------
// The app's data lives in this browser. A sync file in a synced folder backs it up and lets another computer
// use the same data: each browser merges its changes into the file, record by record, newest edit wins.
const SHARED = ["contacts","deals","opps","meetings","focuses","signals","touches","orgs","tasks","campaigns"];
let SH = {handle:null, name:"", ok:false, lastMod:0, busy:false, snap:{}, timer:null, at:""};
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open(IDB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore("h"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v){ const db = await idb(); return new Promise(res => { const tx = db.transaction("h","readwrite"); tx.objectStore("h").put(v, k); tx.oncomplete = res; }); }
async function idbGet(k){ const db = await idb(); return new Promise(res => { const tx = db.transaction("h"); const q = tx.objectStore("h").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
function recHash(r){ const {u, ...rest} = r; return JSON.stringify(rest); }
function snapAll(){ SH.snap = {}; SHARED.forEach(k => (S[k]||[]).forEach(r => { r.id ||= uid(); SH.snap[r.id] = recHash(r); })); }
function stamp(){
  const now = Date.now(), seen = {}; S.tomb ||= {};
  SHARED.forEach(k => (S[k]||[]).forEach(r => { r.id ||= uid(); seen[r.id] = 1; const h = recHash(r); if(SH.snap[r.id] !== h){ r.u = now; SH.snap[r.id] = h; } }));
  Object.keys(SH.snap).forEach(id => { if(!seen[id]){ S.tomb[id] = now; delete SH.snap[id]; } });
}
// Everything that isn't a shared collection (settings, templates, Focus learning, weekly numbers, daily paste status) syncs per key, newest edit wins.
const PREF_SKIP = new Set(["tomb","prefsU"]);
function prefKeys(){ return Object.keys(S).filter(k => !SHARED.includes(k) && !PREF_SKIP.has(k)); }
let PH = null;
function prefStamp(){ S.prefsU ||= {}; const first = !PH; PH ||= {}; const now = Date.now();
  prefKeys().forEach(k => { const h = JSON.stringify(S[k]); if(!first && PH[k] !== undefined && PH[k] !== h) S.prefsU[k] = now; else if(!first && PH[k] === undefined) S.prefsU[k] = now; PH[k] = h; }); }
function mergePrefs(remote){
  if(!remote.prefs || !remote.prefsU) return false; S.prefsU ||= {}; PH ||= {}; let ch = false;
  Object.keys(remote.prefs).forEach(k => { if(SHARED.includes(k) || PREF_SKIP.has(k)) return; if((remote.prefsU[k]||0) > (S.prefsU[k]||0)){ S[k] = remote.prefs[k]; S.prefsU[k] = remote.prefsU[k]; PH[k] = JSON.stringify(S[k]); ch = true; } });
  if(ch && S.settings){ const b = blank(); S.settings = {...b.settings, ...S.settings}; S.templates = {...b.templates, ...(S.templates||{})}; }
  return ch;
}
prefStamp();
// Newest contact record wins, but c.notes from both sides are kept (de-duplicated on date + text).
function mergeNotes(a, b){ const out = [...(a||[])], seen = new Set(out.map(n => n.date + "|" + lc(n.text))); (b||[]).forEach(n => { const k = n.date + "|" + lc(n.text); if(!seen.has(k)){ seen.add(k); out.push(n); } }); return out.sort((x,y) => (x.date||"").localeCompare(y.date||"")); }
function mergeIn(remote){
  S.tomb ||= {}; const rt = remote.tomb || {};
  Object.keys(rt).forEach(id => { if(!S.tomb[id] || rt[id] > S.tomb[id]) S.tomb[id] = rt[id]; });
  let changed = false;
  SHARED.forEach(k => {
    const map = {}; (S[k]||[]).forEach(r => { r.id ||= uid(); map[r.id] = r; });   // records added since the last stamp() have no id yet
    (remote[k]||[]).forEach(r => { if(!r.id) return; const l = map[r.id];
      if(!l || (r.u||0) > (l.u||0)){ if(l && k === "contacts") r.notes = mergeNotes(r.notes, l.notes); map[r.id] = r; changed = true; }
      else if(k === "contacts" && (r.notes||[]).length){ const m = mergeNotes(l.notes, r.notes); if(m.length !== (l.notes||[]).length){ l.notes = m; changed = true; } } });
    const out = Object.values(map).filter(r => !(S.tomb[r.id] && S.tomb[r.id] >= (r.u||0)));
    if(out.length !== (S[k]||[]).length) changed = true;
    S[k] = out;
  });
  return changed;
}
async function shConnect(create){
  try{
    const types = [{description:`${CONFIG.appName} data`, accept:{"application/json":[".json"]}}];
    const h = create ? await window.showSaveFilePicker({suggestedName:`${CONFIG.appName.replace(/[^\w]+/g,"-")}-Shared.json`, types}) : (await window.showOpenFilePicker({types}))[0];
    SH.handle = h; SH.name = h.name; SH.ok = true; await idbSet("shared", h);
    await shSync(true); render(); toast(create ? `Sync file created. Changes now save to your ${CONFIG.drive} automatically.` : "Connected to sync file");
  }catch(e){ if(e && e.name !== "AbortError") toast("Couldn't open that file: " + (e.message||e)); }
}
async function shReconnect(){
  try{ if(await SH.handle.requestPermission({mode:"readwrite"}) === "granted"){ SH.ok = true; await shSync(true); render(); toast("Reconnected"); } }catch(e){ toast("Couldn't reconnect. Pick the file again."); }
}
async function shDisconnect(){ SH = {...SH, handle:null, ok:false, name:""}; await idbSet("shared", null); render(); toast("Disconnected. Data stays in this browser."); }
async function shSync(force){
  if(!SH.ok || !SH.handle || SH.busy) return; SH.busy = true;
  try{
    const f = await SH.handle.getFile();
    let changed = false;
    if(force || f.lastModified !== SH.lastMod){
      const txt = await f.text();
      if(txt.trim()){ try{ const rj = JSON.parse(txt); changed = mergeIn(rj); if(mergePrefs(rj)) changed = true; }catch(e){ toast("Sync file looked damaged; not loaded. Your browser copy is unchanged."); SH.busy = false; return; } }
    }
    stamp();
    const out = {app:CONFIG.appName, v:1, savedBy:S.settings.myname, savedAt:new Date().toISOString(), tomb:S.tomb};
    SHARED.forEach(k => out[k] = S[k]);
    S.prefsU ||= {}; prefStamp(); out.prefs = {}; prefKeys().forEach(k => { if(!S.prefsU[k]) S.prefsU[k] = 1; out.prefs[k] = S[k]; }); out.prefsU = S.prefsU;
    const w = await SH.handle.createWritable(); await w.write(JSON.stringify(out)); await w.close();
    SH.lastMod = (await SH.handle.getFile()).lastModified; SH.at = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    snapAll(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    if(changed && !$("#dlg").open) render();
  }catch(e){ SH.ok = false; toast("Lost access to the sync file. Click Reconnect."); render(); }
  SH.busy = false;
}
function shSoon(){ if(!SH.ok) return; clearTimeout(SH.timer); SH.timer = setTimeout(() => shSync(false), 1200); }
async function shInit(){
  if(!window.showOpenFilePicker || !window.indexedDB) return;
  try{ const h = await idbGet("shared"); if(!h) return; SH.handle = h; SH.name = h.name;
    if(await h.queryPermission({mode:"readwrite"}) === "granted"){ SH.ok = true; await shSync(true); }
    render(); }catch(e){}
  setInterval(() => shSync(false), 20000);
  window.addEventListener("focus", () => shSync(false));
}
function shBanner(){
  if(!SH.handle) return "";
  return SH.ok ? `<span class="chip good" title="Sync file: ${esc(SH.name)}">${esc(TX.Drive)} sync${SH.at ? " · " + SH.at : ""}</span>`
    : `<button class="b s" style="border-color:var(--warn);color:var(--warn)" onclick="shReconnect()">Reconnect ${esc(CONFIG.drive)} sync</button>`;
}

function showMapping(sheet){
  const rows = window._wb.rows(sheet, {defval:"", raw:true});
  window._rows = rows; window._sheet = sheet;
  const headers = rows.length ? Object.keys(rows[0]) : [];
  const guess = f => headers.find(h => FIELD_GUESS[f].includes(h.trim().toLowerCase())) || "";
  openDlg("Match your columns", `
    ${window._wb.names.length > 1 ? `<label>Sheet</label><select onchange="showMapping(this.value)">${window._wb.names.map(s => `<option ${s===sheet?"selected":""}>${esc(s)}</option>`).join("")}</select>` : ""}

    <div class="two">${Object.keys(FIELD_LABELS).map(f => `<div><label>${FIELD_LABELS[f]}</label><select id="map_${f}"><option value="">(skip)</option>${headers.map(h => `<option ${h===guess(f)?"selected":""}>${esc(h)}</option>`).join("")}</select></div>`).join("")}</div>
    <label>If a contact already exists (same email, or same name + ${esc(TX.site)})</label><select id="mapMode"><option value="merge">Update it with the new values</option><option value="skip">Leave it alone</option></select>`,
    `<button class="b" onclick="closeDlg()">Cancel</button><button class="b p" onclick="doImport()">Import</button>`);

function doImport(){
  const m = {}; Object.keys(FIELD_LABELS).forEach(f => m[f] = $("#map_"+f).value);
  const mode = $("#mapMode").value; let added = 0, updated = 0;
  const get = (r,f) => m[f] ? r[m[f]] : "";
  window._rows.forEach(r => {
    let name = String(get(r,"name")||"").trim();
    if(!name) name = [get(r,"first"), get(r,"last")].map(x => String(x||"").trim()).filter(Boolean).join(" ");
    const site = String(get(r,"site")||"").trim();
    if(!name && !site) return;
    const title = String(get(r,"title")||"").trim();
    let persona = String(get(r,"persona")||"").trim(); if(!PERSONAS.includes(persona)) persona = guessPersona(title || persona);
    let at = String(get(r,"accountType")||"").trim(); at = /^n/i.test(at) ? "New" : "Existing";
    const d = {name, title, site, parent:String(get(r,"parent")||"").trim(), email:String(get(r,"email")||"").trim(), phone:String(get(r,"phone")||"").trim(),
      persona, accountType:at, lastTouch:parseDate(get(r,"lastTouch")), lastType:normType(get(r,"lastType")), renewal:parseDate(get(r,"renewal")), context:String(get(r,"context")||"").trim()};
    const ex = S.contacts.find(c => (d.email && c.email && c.email.toLowerCase() === d.email.toLowerCase()) || (c.name && c.name.toLowerCase() === name.toLowerCase() && (c.site||"").toLowerCase() === site.toLowerCase()));
    if(ex){ if(mode === "merge"){ Object.keys(d).forEach(k => { if(d[k]){ if(k === "context") setText(ex, k, d[k]); else ex[k] = d[k]; } }); updated++; } }
    else { S.contacts.push({id:uid(), status:"new", ...d}); added++; }
  });
  syncAccountTypes(); save(); closeDlg(); go("today"); toast(`${added} added, ${updated} updated`);
}

  AF.busy = false; render();
  if(AF.pending.length) autoReview();
  else if(manual) toast(AF.problems.length ? `Nothing new to apply · ${AF.problems.length} file${AF.problems.length > 1 ? "s" : ""} need attention` : "Inbox checked: nothing new");
}
// Puts rows back into a table and sends it through the paste router, exactly like a manual paste.
function autoFeed(rows){
  const H = Object.keys(rows[0]), cell = v => String(v ?? "").replace(/\|/g, "/").replace(/\n/g, "<br>");
  pasteDlg(); $("#pasteBox").value = `| ${H.join(" | ")} |\n|${H.map(() => "---").join("|")}|\n` + rows.map(r => `| ${H.map(h => cell(r[h])).join(" | ")} |`).join("\n");
  previewPaste();
}
function autoApplyLow(){
  const PR = autoSt().processed, t = todayStr(); let n = 0;
  AF.pending.forEach(f => { const low = f.rows.filter(x => x.low); if(!low.length) return;
    autoFeed(low.map(x => x.r)); n += low.length; f.autoN = (f.autoN || 0) + low.length; f.rows = f.rows.filter(x => !x.low);
    const prev = (PR[f.name] && PR[f.name].partial) || [];
    PR[f.name] = f.rows.length ? {on:t, partial:[...prev, ...low.map(x => x.k)], result:`${f.autoN} low-risk rows applied automatically; the rest wait for review`} : {on:t, result:`${f.autoN} low-risk rows applied automatically`}; });
  AF.pending = AF.pending.filter(f => f.rows.length);
  if(n){ closeDlg(); go("today"); toast(`${n} low-risk row${n > 1 ? "s" : ""} applied automatically`); }
}
function autoLine(id, r){
  const keys = {checkin:["replied","meeting booked","meeting date","out of office until","update","next touch","next touch date","meeting change","referral"], tasks:["source","due","priority","detail"], opps:["stage","close date","next step","next step date"], hot:["type","status","next step","next step date"]}[id] || [];
  return keys.map(k => [k, r[k]]).filter(([, v]) => !blankish(v)).map(([k, v]) => `${cap(k)}: ${v}`).join(" · ");
}
function autoReview(){
  const F = AF.pending; if(!F.length){ toast("Nothing waiting in the inbox"); return; }
  openDlg(`Review the automation inbox (${F.length} file${F.length > 1 ? "s" : ""})`, `<p class="muted" style="margin-top:0">These tables arrived from your scheduled flow. Untick anything that's wrong, then Apply. Replies, bookings, not now, do-not-contact, referrals and deals never change without this step${autoSt().lowAuto ? "" : ". Low-risk rows wait here too, because automatic apply is off"}. Nothing is sent to anyone.</p>
    ${F.map((f, i) => `<div class="card" style="margin-bottom:10px;padding:10px 12px"><h2 style="font-size:14px">${esc(f.x.name)} <span class="sub">${esc(f.name)} · ${f.rows.length} row${f.rows.length > 1 ? "s" : ""} to review${f.autoN ? ` · ${f.autoN} applied automatically` : ""}</span></h2>
      ${f.rows.map((x, j) => `<div class="row" style="align-items:flex-start"><input type="checkbox" id="aq${i}_${j}" class="aq" style="width:auto;margin-top:4px" checked>
        <div class="who" style="flex:1"><b>${esc(x.who || "(no name)")}</b><span>${esc(autoLine(f.id, x.r))}</span></div>
        <div>${x.tags.map(([tg, k]) => `<span class="chip ${k}">${esc(tg)}</span>`).join("")}</div></div>`).join("")}</div>`).join("")}`,
    `<button class="b" onclick="closeDlg()">Later</button><button class="b" onclick="autoSkip()">Skip these files</button><button class="b p" id="aqApply" onclick="autoApply()">Apply ticked rows</button>`);
}
function autoPrune(){ const PR = autoSt().processed, k = Object.keys(PR).sort((a, b) => (PR[b].on||"").localeCompare(PR[a].on||"")); k.slice(400).forEach(n => delete PR[n]); }
function autoApply(){
  const F = AF.pending, PR = autoSt().processed, t = todayStr(); let n = 0;
  const chosen = F.map((f, i) => f.rows.filter((x, j) => { const el = $(`#aq${i}_${j}`); return el && el.checked; }));
  closeDlg(); AF.pending = [];
  F.forEach((f, i) => { const rows = chosen[i];
    PR[f.name] = {on:t, result:`${rows.length} of ${f.rows.length} rows applied after review${f.autoN ? `, ${f.autoN} applied automatically` : ""}`};
    if(rows.length){ autoFeed(rows.map(x => x.r)); n += rows.length; } });
  autoPrune(); save(); go("today"); autoWritePrompts(); toast(`${n} row${n === 1 ? "" : "s"} applied from ${F.length} file${F.length > 1 ? "s" : ""}. Nothing was sent.`);
}
function autoSkip(){ const PR = autoSt().processed; AF.pending.forEach(f => PR[f.name] = {on:todayStr(), result:"skipped without applying"}); AF.pending = []; save(); closeDlg(); render(); autoWritePrompts(); toast("Skipped. Those files won't be read again."); }
function autoDismiss(i){ const p = AF.problems[i]; if(!p) return; autoSt().processed[p.name] = {on:todayStr(), result:"problem dismissed: " + p.msg}; AF.problems.splice(i, 1); save(); render(); }
function autoForget(name){ delete autoSt().processed[name]; save(); render(); toast(`${name} will be read again on the next check`); }
// The "since" date for an exchange: the newest inbox file already handled for it, or the last manual paste, so a
// Monday run covers Friday to Sunday and a missed day is covered next time. Default: 3 days back.
function autoSince(id){
  const ds = Object.keys(autoSt().processed).map(n => n.match(AUTO_NAME)).filter(m => m && m[1].toLowerCase() === id).map(m => m[2]);
  if(id === "checkin" && S.lastSync) ds.push(S.lastSync); if(id === "tasks" && S.lastTaskSync) ds.push(S.lastTaskSync);
  const t = todayStr(); return ds.filter(d => d <= t).sort().pop() || addDays(t, -3);
}
// prompts/<id>.md: a Since line, the date the app wrote it, then the prompt. The people listed are from the last time
// the app was opened; over a weekend that's fine, because nobody new starts a sequence while the app is closed.
async function autoWritePrompts(){
  try{ const d = await AF.dir.getDirectoryHandle(CONFIG.automation.prompts, {create:true});
    for(const x of AUTO_X){ const p = x.prompt(); if(!p) continue; const since = autoSince(x.id);
      const text = `Since: ${since}\nWritten by ${CONFIG.appName}: ${todayStr()}\n\nLook at everything since ${since} through today, including weekends and any days that were missed. If the flow's last successful run was earlier than ${since}, start from that run instead.\n\n${p}`;
      const fh = await d.getFileHandle(x.id + ".md", {create:true}); const w = await fh.createWritable(); await w.write(text); await w.close(); }
    autoSt().promptsAt = todayStr(); return true;
  }catch(e){ return false; }
}
async function autoPromptsNow(){ if(!AF.dir || !AF.ok){ toast("Connect the folder first"); return; } const ok = await autoWritePrompts(); save(); render(); toast(ok ? `Today's prompts saved in the "${CONFIG.automation.prompts}" folder` : "Couldn't save the prompts"); }
function autoItNote(){ return `IT note: a scheduled flow in ${CONFIG.automation.tool}, under my account, would send my ${CONFIG.mail} and ${CONFIG.calendar} text since its last run to ${TX.ai} through its API with a fixed prompt, and save the result table in my ${CONFIG.drive} folder. ${CONFIG.appName} (one HTML file, no server, no network calls) applies those files only after I review them, and nothing is ever sent to customers automatically.`; }
function autoRecipeHtml(){
  const ib = esc(CONFIG.automation.inbox), pf = esc(CONFIG.automation.prompts);
  return `<ol style="margin:0;padding-left:20px;line-height:1.6">
    <li><b>Trigger:</b> weekdays at 7:00 (a daily schedule that skips Saturday and Sunday).</li>
    <li><b>Get the prompt:</b> read <code>${pf}/&lt;id&gt;.md</code> from your sync folder. The app rewrites these files every time it opens, checks the inbox or applies a file. Each starts with a <code>Since:</code> date. The list of people is from the last time the app was opened; that's fine over a weekend, because nobody new starts a sequence while the app is closed.</li>
    <li><b>Gather the data:</b> collect ${esc(CONFIG.mail)} messages and ${esc(CONFIG.calendar)} events since the flow's last successful run (or the <code>Since:</code> date, if that's earlier), so Monday's run covers Friday through Sunday and a missed day is covered next time. Use your tool's ${esc(CONFIG.mail)} and ${esc(CONFIG.calendar)} steps. ${esc(TX.Ai)} called through an API can't open your mailbox by itself, so the flow hands it this text.</li>
    <li><b>Run the prompt:</b> send the prompt plus the gathered text to ${esc(TX.ai)}, using the access IT approved.</li>
    <li><b>Save the answer</b> exactly as returned, as a plain text file named <code>&lt;id&gt;_YYYY-MM-DD.md</code> with today's date, in the <code>${ib}</code> folder of the same sync folder. Not a converted online document: the app can't read those.</li>
    <li><b>Repeat</b> steps 2 to 5 for each exchange id below. Never add a step that sends email.</li></ol>
  <table style="margin-top:10px"><thead><tr><th>Exchange id</th><th>What it is</th><th>File the flow saves</th></tr></thead><tbody>${AUTO_X.map(x => `<tr><td><code>${x.id}</code></td><td>${esc(x.name)}</td><td><code>${ib}/${x.id}_${todayStr()}.md</code></td></tr>`).join("")}</tbody></table>`;
}
function autoRecipe(){ openDlg("Flow recipe for your automation tool", `<p class="muted" style="margin-top:0">Give these steps to whoever builds the flow in ${esc(CONFIG.automation.tool)}. It needs access to ${esc(TX.ai)} that IT approved.</p>${autoRecipeHtml()}<div class="hint" style="margin:10px 0 0">${esc(autoItNote())}</div>`, `<button class="b" onclick="copy(autoItNote())">Copy IT note</button><button class="b p" onclick="closeDlg()">Done</button>`); }
// Today: "Inbox from automation" card (top of Today). Empty when automation is off.
function autoCard(){
  if(!autoOn()) return "";
  const PR = autoSt().processed, t = todayStr(), todays = Object.entries(PR).filter(([, v]) => v.on === t);
  const head = `<h2>Inbox from automation <span class="sub">${AF.dir ? `${esc(AF.name)}/${esc(CONFIG.automation.inbox)}${AF.at ? " · checked " + AF.at : ""}` : "not connected yet"}</span></h2>`;
  let body;
  if(!window.showDirectoryPicker && !AF.dir) body = `<p class="muted" style="margin:0">This browser can't open folders, so automation is off here. Use Chrome or Edge, or keep using the copy and paste buttons below.</p>`;
  else if(!AF.dir) body = `<p class="muted" style="margin:0 0 10px">The scheduled flow in ${esc(CONFIG.automation.tool)} saves each morning's tables in the "${esc(CONFIG.automation.inbox)}" folder inside your ${esc(CONFIG.drive)} sync folder. Connect that folder once (it also holds your sync file); the app then reads new files when it opens and when you click Check inbox.</p>
    <div class="toolbar" style="margin:0"><button class="b p" onclick="autoConnect()">Connect sync folder</button><button class="b" onclick="autoRecipe()">How to set up the flow</button></div>`;
  else if(!AF.ok) body = `<p class="muted" style="margin:0 0 10px">After a browser restart, the browser needs your OK before the app can read the folder again.</p><div class="toolbar" style="margin:0"><button class="b p" onclick="autoCheck(true)">Allow and check inbox</button></div>`;
  else body = `<div class="toolbar" style="margin:0">${AF.pending.length ? `<button class="b p" onclick="autoReview()">Review ${AF.pending.length} file${AF.pending.length > 1 ? "s" : ""}</button>` : `<span class="muted" style="font-size:13px">${todays.length ? "Nothing new waiting." : "No files yet today."}</span>`}<button class="b ${AF.pending.length ? "" : "p"}" id="autoCheckBtn" onclick="autoCheck(true)">Check inbox</button><button class="b s" onclick="go('data')">Automation settings</button></div>`;
  const probs = AF.problems.map((p, i) => `<div class="row"><div class="who"><b>${esc(p.name)}</b><span style="color:var(--bad)">${esc(p.msg)}</span></div>${p.name !== "(folder)" ? `<button class="b s" onclick="autoDismiss(${i})">Dismiss</button>` : ""}</div>`).join("");
  const done = todays.map(([n, v]) => `<div class="row"><div class="who"><b>${esc(n)}</b><span>${esc(v.result)}</span></div></div>`).join("");
  return `<div class="card" id="autoCard" style="margin-bottom:14px;border-left:4px solid var(--accent)">${head}${body}${probs ? `<div class="autoProbs" style="margin-top:8px">${probs}</div>` : ""}${done ? `<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:13px">${todays.length} file${todays.length > 1 ? "s" : ""} handled today</summary>${done}</details>` : ""}
    <p class="muted" style="font-size:12px;margin:8px 0 0">Nothing is ever sent for you. If a file doesn't arrive, use the copy and paste buttons below as usual.</p></div>`;
}
// Data & Settings: automation panel. Shown when automation is on, or off but planned ("Not connected yet").
function autoPanel(){
  const A = CONFIG.automation; if(!A || (!A.on && !A.planned)) return "";
  const L = autoOn() ? Object.entries(autoSt().processed).sort((a, b) => (b[1].on||"").localeCompare(a[1].on||"")).slice(0, 12) : [];
  return `<div class="card" style="margin-bottom:14px" id="autoPanel"><h2>Automation <span class="sub">${autoOn() ? (AF.dir ? (AF.ok ? "connected" : "needs your OK") : "on, folder not connected yet") : "Not connected yet"}</span></h2>
    <p class="muted" style="margin-top:0"><b>Route:</b> your company's automation tool (${esc(A.tool)}). A scheduled flow runs the morning prompts in ${esc(TX.ai)} and saves each table in the <code>${esc(A.inbox)}</code> folder of your sync folder. The app reads new files when it opens and when you click Check inbox; a web page can't watch a folder in the background.</p>
    ${autoOn() ? `<div class="toolbar"><button class="b ${AF.dir ? "" : "p"}" onclick="autoConnect()">${AF.dir ? "Change folder" : "Connect sync folder"}</button>${AF.dir ? `<button class="b p" onclick="autoCheck(true)">Check inbox</button><button class="b" onclick="autoPromptsNow()">Save prompts to folder now</button>` : ""}<button class="b" onclick="autoRecipe()">Flow recipe</button></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="aLow" style="width:auto" ${autoSt().lowAuto ? "checked" : ""} onchange="autoSt().lowAuto=this.checked;save();toast(this.checked ? 'Low-risk rows will apply without review' : 'Every row waits for your review')"> Apply low-risk rows without review (out-of-office dates, action items, update notes, meetings for people already booked)</label>
    <p class="muted" style="font-size:12px;margin:4px 0 10px">Replies, new bookings, not now, do-not-contact, referrals, people who left and every deal always wait for your review.</p>` : `<p class="muted">Switched off for now. Once IT approves the flow below, set <code>CONFIG.automation.on</code> to true in the file (or ask for the build to switch it on).</p>`}
    <h3 style="font-size:14px;margin:12px 0 4px">Flow recipe</h3>${autoRecipeHtml()}
    <div class="hint" style="margin-top:10px">${esc(autoItNote())} <button class="b s" onclick="copy(autoItNote())">Copy</button></div>
    ${L.length ? `<h3 style="font-size:14px;margin:12px 0 4px">Files already processed <span class="muted" style="font-weight:400">(never applied twice)</span></h3>${L.map(([n, v]) => `<div class="row"><div class="who"><b>${esc(n)}</b><span>${esc(fmt(v.on))} · ${esc(v.result || "")}</span></div><button class="b s" data-n="${esc(n)}" onclick="autoForget(this.dataset.n)">Read again</button></div>`).join("")}` : ""}</div>`;
}

// ---------- sample (fictional people and organizations; marked sample:true) ----------
function loadSample(){
  if(S.contacts.length){ askConfirm("Add sample contacts to your current data?").then(ok => { if(ok) loadSampleGo(); }); return; }
  loadSampleGo();
}
function loadSampleGo(){
  const t = todayStr();
  const sample = [
    ["Jordan Example","Chief Operating Officer","Northfield Site A","Northfield Group","Existing",addDays(t,-95)+"|Meeting",addDays(t,60),"They approved a review of their main systems last month."],
    ["Sam Sample","Purchasing Manager","Northfield Site A","Northfield Group","Existing",addDays(t,-40),"",""],
    ["Casey Placeholder","Director of Customer Operations","Northfield Site B","Northfield Group","Existing",addDays(t,-200)+"|Call",addDays(t,120),"Opening a second service center next year."],
    ["Riley Demo","IT Infrastructure Manager","Northfield Site B","Northfield Group","Existing","",addDays(t,25),"Software licensing renewal coming up."],
    ["Taylor Example","Head of Finance","Bluewater Example Co","Bluewater Example Co","New","","","Announced an expansion into two new regions."],
    ["Morgan Sample","Vice President, Operations","Bluewater Example Co","Bluewater Example Co","New",addDays(t,-10),"",""],
    ["Alex Placeholder","Security and Risk Lead","Demo Industries Site A","Demo Industries","Existing",addDays(t,-70),"","New compliance audit starting next spring."]
  ];
  // Demo-only settings so the sample looks alive. blank() keeps these empty; anything you already set is left alone.
  const st = S.settings; if(!+st.goal) st.goal = 40; if(!+st.dailyTouches) st.dailyTouches = 20;
  // Sample only: count Talked calls as meetings, and only when talkCounts is still unset.
  if(st.talkCounts === "" || st.talkCounts == null) st.talkCounts = true;

  if(crUnset()){ const p = CR_PRESETS.balanced; CR_KEYS.forEach(k => st[k] = p[k]); }
  if(!(st.reportColumns||[]).length) st.reportColumns = [{name:"Calls", from:"calls"}, {name:"Emails", from:"emails"}, {name:"Meetings set", from:"set"}];
  const added = sample.map(([name,title,site,parent,accountType,lastTouch,renewal,context]) => { const c = {id:uid(), name, title, site, parent, email:"", phone:"", persona:guessPersona(title), accountType, lastTouch:(lastTouch||"").split("|")[0], lastType:(lastTouch||"").split("|")[1]||(lastTouch?"Email":""), renewal, context, status:"new", sample:true}; S.contacts.push(c); return c; });
  // So Prep, Follow up and Other buyers show in the demo: Jordan is booked with a meeting 3 days out, Morgan met today,
  // and their colleagues (Sam, last touched 40 days ago; Taylor, never touched) are ready to start.
  const [jo, , , , , mo] = added;
  jo.status = "booked"; jo.lastTouch = addDays(t,-2); jo.lastType = "Meeting";
  S.meetings.push({id:uid(), created:addDays(t,-2), date:addDays(t,3), type:"Intro call", contactId:jo.id, site:jo.site, name:jo.name, note:"Review of their main systems", sample:true});
  S.touches.push({date:addDays(t,-2), contactId:jo.id, type:"Meeting booked", step:"meeting", sample:true});
  mo.status = "booked"; mo.lastTouch = t; mo.lastType = "Meeting";
  S.meetings.push({id:uid(), created:addDays(t,-10), date:t, type:"Video meeting", contactId:mo.id, site:mo.site, name:mo.name, note:"Expansion plans", status:"held", statusOn:t, sample:true});
  save(); go("today"); toast("Sample data loaded");
}

// ---------- dialog ----------
// In-app replacements for confirm(), alert() and prompt(): native modals are blocked in sandboxed previews and
// embedded viewers (confirm() returns false at once there). They use their own <dialog id="ask">, so they can open
// on top of #dlg without losing it. Each returns a promise: askConfirm -> true/false, askPrompt -> text or null.
// askDlg(msg, {extra:[label, value]}) adds a third button that resolves to value (beginSeq uses it for "Get topic").
function askDlg(msg, o){ o = o || {}; return new Promise(res => {
  const d = $("#ask"), hasIn = o.input != null;
  $("#askT").textContent = o.title || CONFIG.appName;
  $("#askB").innerHTML = `<p style="margin:0;white-space:pre-line">${esc(msg)}</p>${hasIn ? `<input id="askIn" value="${esc(o.input)}" style="margin-top:10px">` : ""}`;
  $("#askF").innerHTML = `${o.alert ? "" : `<button class="b" id="askNo">${esc(o.cancel || "Cancel")}</button>`}${o.extra ? `<button class="b" id="askX">${esc(o.extra[0])}</button>` : ""}<button class="b p" id="askYes">${esc(o.ok || "OK")}</button>`;
  const done = v => { d.onclose = null; if(d.open) d.close(); res(v); };
  if(o.extra) $("#askX").onclick = () => done(o.extra[1]);   // optional third button: resolves to its own value
  $("#askYes").onclick = () => done(hasIn ? $("#askIn").value : true);
  if($("#askNo")) $("#askNo").onclick = () => done(hasIn ? null : false);
  d.onclose = () => done(hasIn ? null : !!o.alert);
  if(!d.open) d.showModal();
  if(hasIn){ $("#askIn").focus(); $("#askIn").onkeydown = e => { if(e.key === "Enter") $("#askYes").click(); }; } else $("#askYes").focus();
}); }
function askConfirm(msg, ok){ return askDlg(msg, {ok:ok || "OK"}); }
function askAlert(msg){ return askDlg(msg, {alert:true}); }
function askPrompt(msg, def){ return askDlg(msg, {input:def || ""}); }
function openDlg(title, body, foot){ $("#dlgT").innerHTML = title; $("#dlgB").innerHTML = body; $("#dlgF").innerHTML = foot || ""; const d = $("#dlg"); if(!d.open) d.showModal(); }
function closeDlg(){ $("#dlg").close(); }

if(S.settings.theme) document.documentElement.dataset.theme = S.settings.theme;
document.title = CONFIG.appName; $("#hdrQ").placeholder = `Find ${TX.aParent} or ${TX.site}`;
snapAll();
render();
shInit();
autoInit();
</script>
